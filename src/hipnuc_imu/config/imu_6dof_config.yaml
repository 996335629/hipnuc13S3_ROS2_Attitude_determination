imu_6dof_node:                    # 节点名，必须与代码中一致
  ros__parameters:
    # 话题配置
    imu_topic: "/IMU_data"        # IMU 数据订阅话题
    output_topic: "/attitude"     # 姿态角发布话题

    # 滤波算法选择
    algorithm: 1                  # 0: Mahony, 1: Madgwick

    # Mahony 参数
    kp: 0.2                       # 比例增益
    ki: 0.001                     # 积分增益

    # Madgwick 参数
    beta: 0.05                    # 梯度下降步长

    # 初始化静止时间（秒）
    init_static_time: 2.0

    # 低通滤波开关及截止频率
    enable_lpf: true              # 是否启用低通滤波
    accel_lpf_freq: 1.0           # 加速度计截止频率 (Hz)
    gyro_lpf_freq: 1.0            # 陀螺仪截止频率 (Hz)
  # imu_6dof_params.yaml


# 节点2: EKF 节点 (节点名 ekf_6dof_node)
ekf_6dof_node:
  ros__parameters:
    # 话题配置
    imu_topic: "/IMU_data"
    output_topic: "/attitude"
    # 初始化静止时间（秒）
    init_static_time: 2.0

    sigma_g: 0.02          # 陀螺角速度噪声 (rad/s/√Hz)
    sigma_b: 1.0e-4        # 零偏随机游走 (rad/s/√s/√Hz)
    sigma_a: 0.01          # 加速度计量测噪声 (归一化后)
    
    # 低通滤波开关及截止频率
    enable_lpf: false      # EKF 自身有滤波效果，低通滤波默认关闭
    accel_lpf_freq: 30.0 
    gyro_lpf_freq: 30.0 
    expected_g_norm: 9.81  # 重力幅值 (m/s² 或 g，根据IMU数据单位)
    accel_gate: 2.0        # 外部加速度门限 (0=禁用检测)